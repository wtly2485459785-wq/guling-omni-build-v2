name: Test only (no packaging)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PROJECT_ROOT: guling-project
      ZIP_PASSWORD: ${{ secrets.ZIP_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ensure 7-Zip is available
        run: |
          if ! command -v 7z >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq p7zip-full
          fi

      - name: Decrypt test source
        run: |
          if [ -z "$ZIP_PASSWORD" ]; then
            echo "::error::Repository secret ZIP_PASSWORD is not set"
            exit 1
          fi
          mkdir -p "$PROJECT_ROOT"
          7z x -y -p"$ZIP_PASSWORD" guling-test-V20-40.zip -o"$PROJECT_ROOT" >/dev/null
          test -f "$PROJECT_ROOT/www/config.js" || { echo "::error::decrypt failed or archive layout invalid"; exit 1; }

      - name: Install dependencies
        run: |
          cd "$PROJECT_ROOT"
          npm install

      - name: Install Playwright Chromium
        run: |
          cd "$PROJECT_ROOT"
          npx playwright install --with-deps chromium

      - name: Sync assets before tests
        run: |
          cd "$PROJECT_ROOT"
          mkdir -p android/app/src/main/assets/public
          cp -r www/* android/app/src/main/assets/public/

      - name: Run tests
        env:
          SMOKE_REQUIRED: '1'
        run: |
          cd "$PROJECT_ROOT"
          npm test
