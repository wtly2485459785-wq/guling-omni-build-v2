name: Build Guling OMNI APK

on:
  push:
    paths:
      - 'guling-omni-V*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PROJECT_ROOT: guling-project
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ZIP_PASSWORD: ${{ secrets.ZIP_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect latest encrypted source zip
        id: detect
        run: |
          ZIP_NAME=$(ls -1 guling-omni-V*.zip 2>/dev/null | sort -V | tail -1)
          if [ -z "$ZIP_NAME" ]; then
            echo "::error::no guling-omni-V*.zip found in repo root"
            exit 1
          fi
          VERSION=$(echo "$ZIP_NAME" | sed -E 's/^guling-omni-(.*)\.zip$/\1/')
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected: $ZIP_NAME (version $VERSION)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK components
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Ensure 7-Zip is available
        run: |
          if ! command -v 7z >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq p7zip-full
          fi
          7z i | head -n 2

      - name: Decrypt and unzip project
        run: |
          if [ -z "$ZIP_PASSWORD" ]; then
            echo "::error::Repository secret ZIP_PASSWORD is not set"
            exit 1
          fi
          mkdir -p "$PROJECT_ROOT"
          7z x -y -p"$ZIP_PASSWORD" "${{ steps.detect.outputs.zip_name }}" -o"$PROJECT_ROOT" >/dev/null
          test -f "$PROJECT_ROOT/www/config.js" || { echo "::error::decrypt failed or archive layout invalid"; exit 1; }
          ls "$PROJECT_ROOT"

      - name: Patch version from zip name
        id: ver
        run: |
          VER="${{ steps.detect.outputs.version }}"
          sed -i "s/const CURRENT_VERSION = '[^']*'/const CURRENT_VERSION = 'OMNI-$VER'/" "$PROJECT_ROOT/www/config.js"
          NUM="${VER#V}"
          MAJOR="${NUM%%-*}"
          MINOR="${NUM#*-}"; [ "$MINOR" = "$NUM" ] && MINOR=0
          MINOR=$(echo "$MINOR" | sed -E 's/[^0-9].*$//'); [ -z "$MINOR" ] && MINOR=0
          CODE=$(( MAJOR * 1000 + MINOR ))
          echo "name=$MAJOR.$MINOR" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "版本：$MAJOR.$MINOR ($CODE)"
          grep CURRENT_VERSION "$PROJECT_ROOT/www/config.js"

      - name: Install dependencies
        run: |
          cd "$PROJECT_ROOT"
          npm install

      - name: Sync assets before tests
        run: |
          cd "$PROJECT_ROOT"
          mkdir -p android/app/src/main/assets/public
          cp -r www/* android/app/src/main/assets/public/

      - name: Run self-checks
        run: |
          cd "$PROJECT_ROOT"
          npm test

      - name: Capacitor sync
        run: |
          cd "$PROJECT_ROOT"
          npx cap sync android

      - name: Register native plugin
        run: |
          cd "$PROJECT_ROOT"
          node scripts/register-native-plugin.cjs

      - name: Build APK
        run: |
          cd "$PROJECT_ROOT/android"
          chmod +x ./gradlew
          ./gradlew assembleDebug -PgulingVersionName=${{ steps.ver.outputs.name }} -PgulingVersionCode=${{ steps.ver.outputs.code }}

      - name: Publish encrypted APK package
        run: |
          APK="$PROJECT_ROOT/android/app/build/outputs/apk/debug/app-debug.apk"
          VER="${{ steps.detect.outputs.version }}"
          OUT="guling-omni-$VER.apk"
          PKG="guling-apk-$VER.zip"
          cp "$APK" "$OUT"
          7z a -tzip -p"$ZIP_PASSWORD" -mem=AES256 "$PKG" "$OUT" >/dev/null
          rm -f "$OUT"
          ls -l "$PKG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PKG"
          git commit -m "build $PKG" || echo "nothing to commit"
          git push

